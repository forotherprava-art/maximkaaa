```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Макс</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #ff3366;
            font-size: clamp(40px, 10vw, 100px);
            text-align: center;
            font-weight: 900;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            text-shadow: 0 0 20px #ff336688;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }
    </style>
</head>

<body>
    <h1>Макс педик</h1>
</body>
</html>
